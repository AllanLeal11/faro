[project]
name = "faro-backend"
version = "0.1.0"
description = "Faro backend: message analysis pipeline, trusted circle, family alerts."
authors = [
    { name = "Allan Leal", email = "aleal0255@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
    "openai>=3.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.28.0",
    "ruff>=0.16.7",
    "bandit>=1.9.4",
]

[tool.uv]
# This is a service run with `uvicorn app.main:app`, not a library to be
# built and published — skip packaging it.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: allow assert in tests.
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
