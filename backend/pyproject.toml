[project]
name = "faro-backend"
version = "0.1.0"
description = "Faro backend: message analysis pipeline, trusted circle, family alerts."
authors = [
    { name = "Allan Leal", email = "aleal0255@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
    "boto3>=1.40.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
    "ruff>=0.16.7",
    "bandit>=1.9.4",
]

[tool.uv]
# This is a service run with `uvicorn app.main:app`, not a library to be
# built and published — skip packaging it.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: allow assert in tests.
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101: assert in tests. S105-S107: demo/test credentials are not secrets.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults are calls by design (B008).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
